app.faq.q7: 'How much does a website cost?'
app.faq.a7: 'A website for phone and desktop starts at €690 one-time. Care with hosting, .de domain, SSL certificate, updates and backups costs €15 a month, billed and cancellable yearly. A business email costs €49 one-time, setup for Google and AI search €120, changes €75 per hour. All prices plus VAT.'
app.faq.q8: 'Can I bring my domain and email from Wix, GMX or Strato?'
app.faq.a8: 'Yes. I move domains and mailboxes from Wix, GMX, Strato or other providers, including redirects, so that no email and no Google listing gets lost.'
app.faq.q9: 'How do I get found on Google and in AI search like ChatGPT?'
app.faq.a9: 'With a well-maintained Google Business Profile, local search terms, structured data and clear answers to typical customer questions. That way your business shows up in Google search, Google Maps and in answers from ChatGPT, Gemini or Perplexity.'
app.faq.q10: 'Do you only work in Ibbenbüren?'
app.faq.a10: 'No. For websites I am happy to visit in person in Ibbenbüren, Osnabrück and Münsterland. Symfony software projects I deliver remotely across Germany.'
