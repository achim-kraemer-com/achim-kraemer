app.page.hosting.title: 'Hosting, Domains, Email & SSL from a Single Source | Achim Krämer'
app.page.hosting.description: 'Web hosting, domain management, professional email setup and SSL certificates: operation and development of your website from a single source, with transparent pricing.'
app.page.hosting.h1: 'Hosting, Domains, Email & SSL from a Single Source'
app.page.hosting.lead: 'Besides development, I can also take care of the technical foundation of your website: hosting, domains, email addresses and encryption, with transparent pricing.'
app.page.hosting.b1: '<b>Web hosting</b> for websites and web applications'
app.page.hosting.b2: '<b>Domain management</b>: registration, transfer and upkeep'
app.page.hosting.b3: '<b>Email setup</b> on your own domain for programs and devices'
app.page.hosting.b4: '<b>SSL certificates</b> for encrypted connections'
app.page.hosting.q1: 'Why development and hosting from a single source?'
app.page.hosting.a1: 'You have one contact for website, server, domain and email. That shortens communication, avoids finger-pointing between providers and keeps your technology together.'
app.page.hosting.q2: 'What does email setup with your own domain mean?'
app.page.hosting.a2: 'Instead of a generic address you use addresses like name@your-company.com. I set up mailboxes and connect them to your programs and devices.'
app.page.hosting.q3: 'Why do I need an SSL certificate?'
app.page.hosting.a3: 'An SSL certificate encrypts the connection between visitor and server. Browsers flag pages without encryption as not secure, and it matters for privacy and trust.'
