app.services.title7: 'Hosting, Domains, Email & SSL'
app.services.text7_1: '<b>Web hosting</b> – running your website or application on reliable infrastructure, together with development if you wish.'
app.services.text7_2: '<b>Domain management</b> – registration, transfer and upkeep of your domains in one place.'
