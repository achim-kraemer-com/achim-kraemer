app.page.symfony.title: 'Symfony Development: Custom Web Applications | Achim Krämer'
app.page.symfony.description: 'Custom web applications with Symfony and PHP: dashboards, user management, login and automated processes from a freelance Symfony developer with over 20 years of experience.'
app.page.symfony.h1: 'Symfony Development for Custom Web Applications'
app.page.symfony.lead: 'As a freelance Symfony developer with over 20 years of PHP experience, I build web applications that fit your workflows: robust, scalable and secure.'
app.page.symfony.b1: '<b>Dashboards & statistics</b> with real-time data and charts'
app.page.symfony.b2: '<b>User management</b> with a role and permission system'
app.page.symfony.b3: '<b>Login & authentication</b> via email, Google or other providers, with 2FA on request'
app.page.symfony.b4: '<b>Performance & security</b> through caching, tuning and current security standards'
app.page.symfony.q1: 'When is a custom Symfony application worth it?'
app.page.symfony.a1: 'It pays off when off-the-shelf software does not fit your workflows or when manual tasks and errors cost time. A custom application automates exactly those processes and integrates seamlessly into existing systems.'
app.page.symfony.q2: 'Do you also take over existing Symfony projects?'
app.page.symfony.a2: 'Yes. Besides new developments I optimize existing applications and maintain them long term, for example with regard to load times, maintainability and security.'
app.page.symfony.q3: 'How do you ensure quality?'
app.page.symfony.a3: 'Through clean architecture following Symfony best practices, automated tests, reproducible Docker environments and automated deployments, plus close and clear communication with everyone involved.'
app.page.symfony.link: ''
app.page.api.title: 'API Development & Integrations with Symfony | Achim Krämer'
app.page.api.description: 'REST APIs, data import and export, PDF generation and background processes: integrations and automation with Symfony from a freelance PHP developer.'
app.page.api.h1: 'API Development, Integrations & Automation'
app.page.api.lead: 'I connect your application to external services, provide your own interfaces and automate recurring tasks such as document creation and data exchange.'
app.page.api.b1: '<b>Connect external services</b>: payment providers, CRM, ERP'
app.page.api.b2: '<b>Your own API</b>: provide data for third parties'
app.page.api.b3: '<b>Data import & export</b>: automated exchange with other systems'
app.page.api.b4: '<b>PDF, email & background processes</b>: invoices, reports, email processing and scheduled tasks'
app.page.api.q1: 'What is an API and why do I need one?'
app.page.api.a1: 'An API lets systems exchange data automatically. You need one when your application should, for example, reconcile payments, customer data or orders with other services instead of having someone transfer them by hand.'
app.page.api.q2: 'What kinds of interfaces do you build?'
app.page.api.a2: 'I work with REST, GraphQL and SOAP, connect external APIs and build custom interfaces for your application based on Symfony.'
app.page.api.q3: 'What can be automated in the background?'
app.page.api.a3: 'Typical examples are the automatic creation of invoices and reports as PDF, processing of incoming emails and scheduled tasks such as nightly data processing.'
app.page.api.link: ''
app.page.ai.title: 'AI Integration & Agentic AI for PHP Applications | Achim Krämer'
app.page.ai.description: 'AI agents, RAG assistants, data extraction from PDFs and content automation: LLM integration added safely and sensibly to existing Symfony systems.'
app.page.ai.h1: 'AI Integration & Agentic AI'
app.page.ai.lead: 'I integrate AI where it actually takes load off your processes: sensibly, securely and matched to your existing systems.'
app.page.ai.b1: '<b>Autonomous AI agents</b> analyze processes, call APIs and handle support and research tasks'
app.page.ai.b2: '<b>Company AI (RAG)</b> answers questions based on your internal knowledge'
app.page.ai.b3: '<b>Data extraction</b> turns PDFs, invoices and images into structured data'
app.page.ai.b4: '<b>Content automation</b> creates context-aware texts such as product descriptions or reports'
app.page.ai.q1: 'What is agentic AI?'
app.page.ai.a1: 'Agentic AI refers to AI agents that do not just answer questions but analyze processes on their own, call interfaces and solve tasks fully automatically.'
app.page.ai.q2: 'How is company data protected in AI solutions?'
app.page.ai.a2: 'With RAG assistants the AI is fed with your internal company knowledge and delivers precise, privacy-compliant answers for employees or customers. How the data is processed is agreed on together beforehand.'
app.page.ai.q3: 'Can AI be integrated into existing systems?'
app.page.ai.a3: 'Yes. LLMs are connected via interfaces and fit into existing Symfony and PHP applications without you having to replace your systems.'
app.page.ai.link: ''
app.page.mirwena.title: 'Mirwena: Digital Patient Intake Form for Therapy Practices | Case Study'
app.page.mirwena.description: 'Case study Mirwena: GDPR-compliant digital patient intake form for physiotherapy, osteopathy and occupational therapy practices, built with Symfony by Achim Krämer.'
app.page.mirwena.h1: 'Mirwena – Digital Patient Intake Form for Therapy Practices'
app.page.mirwena.lead: 'Mirwena is a web application for physiotherapy, osteopathy and occupational therapy practices: patients fill out the intake form on their own phone before the appointment, and the practice receives it complete, legible and encrypted.'
app.page.mirwena.b1: '<b>Symfony backend</b> with a dedicated installation, database and key per practice'
app.page.mirwena.b2: '<b>Field-level encryption</b> of sensitive health data (Art. 9 GDPR)'
app.page.mirwena.b3: '<b>Interactive body chart</b> for marking pain zones with a finger'
app.page.mirwena.b4: '<b>Single-use access</b> via email link and QR code, automatically invalidated after 24 hours'
app.page.mirwena.q1: 'Which problem does Mirwena solve?'
app.page.mirwena.a1: 'Practices no longer have to retype forms or decipher illegible handwriting. Patients fill out the form calmly before the appointment, and the practice receives it digitally and complete.'
app.page.mirwena.q2: 'How does Mirwena protect sensitive health data?'
app.page.mirwena.a2: 'Complaints, pre-existing conditions, medication and signature are stored encrypted field by field. Each practice gets its own installation with its own database and key instead of a shared data pool. Access links are valid for 24 hours and are then invalidated and deleted.'
app.page.mirwena.q3: 'What did I build as the developer?'
app.page.mirwena.a3: 'Architecture, backend, user interface and operations. The project also includes a dedicated subdomain per practice with individual colors and logo as well as a formatted PDF print view.'
app.page.mirwena.link: 'View the project on mirwena.de'
app.page.freelancer.title: 'Freelancer CRM with Symfony: Customers, Projects, Invoices | Case Study'
app.page.freelancer.description: 'Case study: a custom freelancer CRM built on Symfony 8 for customers, projects, tasks and invoices with automatic PDF creation.'
app.page.freelancer.h1: 'Freelancer CRM – Customers, Projects and Invoices'
app.page.freelancer.lead: 'A Symfony application for my own freelance business: it manages customers, projects and tasks and turns them into invoices as PDF.'
app.page.freelancer.b1: '<b>Customer → project → task → invoice</b> as one continuous flow'
app.page.freelancer.b2: '<b>Billing</b> by the hour or at a fixed price per task'
app.page.freelancer.b3: '<b>Invoice PDF</b> from selected open tasks of a project, with the statuses created, sent and paid'
app.page.freelancer.b4: '<b>Protected admin area</b> with login and roles'
app.page.freelancer.q1: 'What is the freelancer CRM used for?'
app.page.freelancer.a1: 'It replaces spreadsheets and manual invoice templates: tasks are recorded, assigned to a project and later turned into invoices in bulk.'
app.page.freelancer.q2: 'How is an invoice created?'
app.page.freelancer.a2: 'From the open tasks of a project the application picks the items to bill and fills a PDF template automatically. The invoice status can be tracked from creation to payment.'
app.page.freelancer.q3: 'Which technology is behind it?'
app.page.freelancer.a3: 'Symfony 8 with PHP 8.5, Doctrine ORM, MariaDB and Docker. The area behind the login is not public, the landing page is available online.'
app.page.freelancer.link: 'Visit the freelancer portal'
app.page.signature.title: 'Email Signature Generator for Outlook, Apple Mail & Gmail | Case Study'
app.page.signature.description: 'Case study: a web tool that creates professional email signatures in minutes and pastes them into Outlook, Apple Mail or Gmail with one click.'
app.page.signature.h1: 'Email Signature Generator'
app.page.signature.lead: 'Enter your contact details once, upload a logo and paste the finished signature into Outlook, Apple Mail or Gmail with one click.'
app.page.signature.b1: '<b>Everything in one form</b>: name, company, address, phone, social media links and bank details'
app.page.signature.b2: '<b>Two layouts</b> per signature, optionally with a round logo'
app.page.signature.b3: '<b>Automatic logo cropping</b> on upload'
app.page.signature.b4: '<b>Copy with one click</b>: the signature lands formatted in the clipboard'
app.page.signature.q1: 'Which problem does the tool solve?'
app.page.signature.a1: 'Consistent, professionally designed email signatures are tedious when built by hand in HTML. The tool takes your data and logo and delivers a finished signature.'
app.page.signature.q2: 'How do I add the signature to my mail client?'
app.page.signature.a2: 'One click copies the signature formatted to the clipboard. From there it can be pasted straight into the signature settings of Outlook, Apple Mail or Gmail.'
app.page.signature.q3: 'How is the tool built?'
app.page.signature.a3: 'As a Symfony application with Twig templates and some JavaScript for logo cropping and the clipboard. The landing page is public, signatures are created after login.'
app.page.signature.link: 'Visit the email signature tool'
app.faq.title: 'Frequently Asked Questions'
app.faq.q1: 'What does a Symfony freelancer do?'
app.faq.a1: 'A Symfony freelancer develops web applications as a self-employed professional using the PHP framework Symfony, from dashboards and user management to interfaces and automation. I have been developing software for over 20 years, more than 15 of them with Symfony, from the idea through implementation to ongoing operation.'
app.faq.q2: 'Which projects am I the right fit for?'
app.faq.a2: 'New developments, optimization of existing applications and long-term maintenance. Typical tasks are custom web applications, API integrations, document automation and AI integration.'
app.faq.q3: 'How do I use AI in projects?'
app.faq.a3: 'I build AI agents, RAG assistants based on your company knowledge, data extraction from PDFs and invoices as well as content automation, and integrate them into existing systems.'
app.faq.q4: 'How secure and privacy-compliant are your applications?'
app.faq.a4: 'Security and privacy are part of the architecture from the start. With Mirwena, for example, health data is stored encrypted field by field, and each practice has its own database and key.'
app.faq.q5: 'Which technologies do you work with?'
app.faq.a5: 'PHP 8.x and Symfony, Doctrine ORM, MySQL, MariaDB and PostgreSQL, REST and GraphQL, JavaScript and TailwindCSS as well as Docker, CI/CD and Git.'
app.faq.q6: 'How can I get in touch?'
app.faq.a6: 'Via the contact form on this page, by email at kontakt@achim-kraemer.com or by phone at +49 1756 821391.'
