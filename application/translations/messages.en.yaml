app.about.text: 'Welcome! As an experienced PHP and Symfony developer with over 20 years of expertise, I support your project from idea to successful implementation. You benefit from tailor-made, scalable solutions, fast development cycles, and a focus on performance and security. Whether it´s new development, optimizing existing applications, or long-term support – I am your reliable partner to help you achieve your goals efficiently and successfully.'
app.portfolio.title1: 'Symfony Expertise:'
app.portfolio.text1: 'Efficient use of all Symfony components and best practices for clean, maintainable applications.'
app.portfolio.title2: 'Architecture and Design Patterns:'
app.portfolio.text2: 'Experienced in MVC, DDD, and hexagonal architecture, ideal for complex, long-lasting solutions.'
app.portfolio.title3: 'API and Performance Optimization:'
app.portfolio.text3: 'Customized caching strategies and optimized database queries for high-performance applications.'
app.portfolio.title4: 'Testing and CI/CD:'
app.portfolio.text4: 'Quality assurance through testing, automated deployments, and containerization (Docker).'
app.portfolio.title5: 'Communication and Teamwork:'
app.portfolio.text5: 'Clear project communication and close collaboration with stakeholders.'
app.portfolio.title6: 'Technologies and Tools:'
app.portfolio.text6: 'Programming Languages: PHP8.x+, JavaScript, HTML5, CSS3<br>Frameworks: Symfony 2 - 7+, jQuery<br>Databases: MySQL, PostgreSQL, MongoDB, Firestore, BigQuery<br>APIs: REST, GraphQL, SOAP<br>DevOps: Docker, Jenkins<br>Version Control: Git, GitHub, GitLab'
app.portfolio.end_text: 'I look forward to driving your project forward together with you!'
app.references.text: 'Selected projects I have delivered as a freelance Symfony developer – from architecture and development through to live operation.'
app.references.mirwena_category: 'Digital patient intake for therapy practices'
app.references.mirwena_title: 'Mirwena – Digital Patient Intake Form'
app.references.mirwena_link_title: 'Mirwena – digital patient intake form for physiotherapy and osteopathy practices'
app.references.mirwena_text: 'Mirwena is a web application for physiotherapy, osteopathy and occupational therapy practices: patients complete their intake form at home on their own phone before the appointment, and the practice receives it complete, legible and encrypted – no retyping, no unreadable handwriting. I built the project as a freelance developer: architecture, backend, interface and operations.'
app.references.mirwena_feature1: '<b>Symfony backend</b> – a dedicated installation, database and encryption key per practice instead of one shared data pool.'
app.references.mirwena_feature2: '<b>GDPR-compliant encryption</b> – complaints, pre-existing conditions, medication and signature are stored field-by-field encrypted (Art. 9 GDPR).'
app.references.mirwena_feature3: '<b>Interactive body chart</b> – patients mark pain zones on the front and back view directly with their finger.'
app.references.mirwena_feature4: '<b>Secure single-use access</b> – links via email and QR code, valid for 24 hours, then automatically invalidated and deleted.'
app.references.mirwena_feature5: '<b>Multi-tenancy &amp; branding</b> – a dedicated subdomain per practice with individual colours, logo and a formatted PDF print view.'
app.references.mirwena_link: 'View the project on mirwena.de'
app.references.mirwena_tech_privacy: 'GDPR'
app.references.mirwena_schema_description: 'Digital patient intake form for physiotherapy, osteopathy and occupational therapy practices: patients complete the form on their own device before the appointment, and the practice receives it complete, legible and encrypted in line with GDPR. Built by Achim Krämer as a freelance Symfony developer.'
app.testimonials.title: 'Client testimonials'
app.testimonials.text: 'Successful projects are built on trust, transparency and technical quality. Here my clients share their experience of working together. (Quotes in the original German.)'
app.testimonials.iris_role: 'Legal guardian'
app.testimonials.iris_quote: 'Achim Krämer hat meine Website als rechtliche Betreuerin professionell und sehr gut erstellt. Vielen Dank für die freundliche und kompetente Beratung. Wünsche meinerseits wurden umgehend und zufriedenstellend umgesetzt. Auch anschließend war er immer kurzfristig erreichbar.'
app.testimonials.thomas_role: 'Therapy practice'
app.testimonials.thomas_quote: 'Moin Achim, ich wollte mich ganz herzlich bei dir bedanken. Du hast meine Vorstellungen super umgesetzt und immer auf Augenhöhe mit mir kommuniziert. Du konntest meine Bedenken und Fragen sehr gut beantworten – dabei immer kompetent, aber dennoch unkompliziert. Und es hat richtig viel Spaß gemacht, mit dir zusammenzuarbeiten.'
app.testimonials.thorsten_role: 'ELB Solution'
app.testimonials.thorsten_quote: 'Wir sind sehr zufrieden mit der Erstellung unserer ersten Homepage durch Achim Krämer. Für ELB Solution war es der erste Schritt ins Internet – und die Umsetzung hätte besser nicht laufen können. Von Anfang an war die Zusammenarbeit unkompliziert, professionell und angenehm. Unsere Vorstellungen wurden schnell aufgenommen und mit viel Kreativität sowie technischem Know-how umgesetzt. Die Webseite ist modern, übersichtlich und funktioniert auf allen Geräten einwandfrei. Auch Änderungswünsche wurden zügig und zuverlässig umgesetzt. Dank Achim Krämer hat ELB Solution nun einen richtig gelungenen ersten Webauftritt. Klare Weiterempfehlung und vielen Dank für die tolle Arbeit!'
