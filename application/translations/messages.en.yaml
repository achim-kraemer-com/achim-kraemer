app.page.hosting.h1: 'Hosting, Domains, Email & SSL from a Single Source'
app.page.hosting.lead: 'Besides development, I can also take care of the technical foundation of your website: hosting, domains, email addresses and encryption, with transparent pricing.'
app.page.hosting.b1: '<b>Web hosting</b> for websites and web applications'
app.page.hosting.b2: '<b>Domain management</b>: registration, transfer and upkeep'
app.page.hosting.b3: '<b>Email setup</b> on your own domain for programs and devices'
app.page.hosting.b4: '<b>SSL certificates</b> for encrypted connections'
app.page.hosting.q1: 'Why development and hosting from a single source?'
app.page.hosting.a1: 'You have one contact for website, server, domain and email. That shortens communication, avoids finger-pointing between providers and keeps your technology together.'
app.page.hosting.q2: 'What does email setup with your own domain mean?'
app.page.hosting.a2: 'Instead of a generic address you use addresses like name@your-company.com. I set up mailboxes and connect them to your programs and devices.'
app.page.hosting.q3: 'Why do I need an SSL certificate?'
app.page.hosting.a3: 'An SSL certificate encrypts the connection between visitor and server. Browsers flag pages without encryption as not secure, and it matters for privacy and trust.'
app.page.hosting.link: ''
app.page.packages.title: 'Website Packages with Prices: Website, Email & Google | Achim Krämer'
app.page.packages.description: 'Fair fixed prices for small businesses, cancellable yearly: website from €690, care with hosting and SSL for €15 a month, business email, SEO and a free email signature.'
app.page.packages.h1: 'Website packages for small businesses'
app.page.packages.lead: 'Website, domain, email and Google visibility from a single source, without expensive monthly packages. You take care of your customers, I take care of the technology.'
app.page.packages.b1: '<b>Fixed prices</b>, ongoing €240 a year including SEO upkeep, cancellable yearly'
app.page.packages.b2: '<b>One point of contact</b> for website, domain, email and Google'
app.page.packages.b3: '<b>Send changes via WhatsApp</b>, €75 per hour in 15-minute steps'
app.page.packages.b4: '<b>In person on site</b> in Ibbenbüren, Osnabrück and Münsterland'
app.page.packages.q1: 'Which costs are ongoing?'
app.page.packages.a1: 'Website care and SEO upkeep run for one year each and can be cancelled at the end of the year. Everything else is paid once. If you cancel, you receive your domain, content and emails in full.'
app.page.packages.q2: 'Can I keep my existing domain and email?'
app.page.packages.a2: 'Yes. I move domains and mailboxes from Wix, GMX, Strato or other providers, including redirects, so that no email and no Google listing gets lost.'
app.page.packages.q3: 'What does SEO for AI search mean?'
app.page.packages.a3: 'More and more people ask ChatGPT, Gemini or Google AI answers instead of searching the classic way. Structured data, clear answers to typical questions and a well-maintained Google Business Profile make sure your business is mentioned there.'
app.page.packages.link: ''
app.page.upgrade.title: 'Symfony Upgrade: from Symfony 5 or 6 to 7.4 LTS | Achim Krämer'
app.page.upgrade.description: 'Symfony upgrades and PHP migrations without downtime: from Symfony 5.4 or 6.4 to 7.4 LTS, with analysis, fixed-price option and tests. Freelance Symfony developer with more than 15 years of Symfony experience.'
app.page.upgrade.h1: 'Symfony Upgrade to 7.4 LTS – planned and without downtime'
app.page.upgrade.lead: 'Your application still runs on Symfony 5 or 6 and an old PHP version? I move it step by step to Symfony 7.4 LTS and a current PHP version without disrupting day-to-day operations.'
app.page.upgrade.b1: '<b>Upgrade analysis</b> with an effort estimate before any code is changed'
app.page.upgrade.b2: '<b>Deprecations first</b> – remove the warnings of the old version, then make the version jump'
app.page.upgrade.b3: '<b>PHP migration</b> to a version that still receives security updates'
app.page.upgrade.b4: '<b>Backed by tests</b> – automated tests before and after every step'
app.page.upgrade.q1: 'Why should I upgrade my Symfony application?'
app.page.upgrade.a1: 'Older Symfony and PHP versions eventually stop receiving security updates. The longer you wait, the more versions you have to skip at once, and that gets more expensive every year. An upgrade also brings better performance and modern tooling.'
app.page.upgrade.q2: 'How long does a Symfony upgrade take?'
app.page.upgrade.a2: 'It mainly depends on the size of the application, the number of dependencies and whether there are tests. Small applications are often done in a few days, large projects take several weeks. After the analysis you get a concrete estimate.'
app.page.upgrade.q3: 'Does the application have to go offline during the upgrade?'
app.page.upgrade.a3: 'No. The upgrade happens in a separate branch and test environment. It only goes live once everything has been verified, and even then with a way back.'
app.page.upgrade.link: ''
app.page.maintenance.title: 'Take Over, Maintain and Extend Symfony Projects | Achim Krämer'
app.page.maintenance.description: 'Your developer has left or the agency no longer has time? I take over existing Symfony projects, assess their condition, keep them secure and keep developing them.'
app.page.maintenance.h1: 'Taking over, maintaining and extending Symfony projects'
app.page.maintenance.lead: 'Your Symfony application is running, but nobody really looks after it any more? I take over existing projects, get an honest overview and make sure it stays secure and can keep evolving.'
app.page.maintenance.b1: '<b>Project takeover</b> from agencies, in-house teams or other freelancers'
app.page.maintenance.b2: '<b>Code review and assessment</b> with a clear list of risks'
app.page.maintenance.b3: '<b>Ongoing maintenance</b> – security updates, dependencies, monitoring'
app.page.maintenance.b4: '<b>Further development</b> of new features on a stable foundation'
app.page.maintenance.q1: 'Do you take over projects someone else built?'
app.page.maintenance.a1: 'Yes, that is a large part of my work. I get to grips with other people''s code, even without documentation or tests, and tell you openly what state the application is in.'
app.page.maintenance.q2: 'What does maintaining a Symfony application involve?'
app.page.maintenance.a2: 'Regular updates of Symfony, PHP and all packages, checking security advisories, backups and monitoring, and fixing small bugs before they become big ones.'
app.page.maintenance.q3: 'What if the code is in bad shape?'
app.page.maintenance.a3: 'Then it does not get rewritten from scratch. I first secure the most important workflows with tests and then improve the code step by step while the application keeps running.'
app.page.maintenance.link: ''
app.page.agency.title: 'Symfony Freelancer or Agency? An Honest Comparison | Achim Krämer'
app.page.agency.description: 'Symfony freelancer or agency: cost, point of contact, availability and risk compared. When each option makes sense, explained by a freelance Symfony developer.'
app.page.agency.h1: 'Symfony freelancer or agency – which fits your project?'
app.page.agency.lead: 'Both can be the right choice. What matters is the size and duration of the project, your budget and how much coordination you want to do yourself. Here is an honest comparison, including where an agency is the better fit.'
app.page.agency.b1: '<b>Freelancer</b>: one fixed point of contact who writes the code personally'
app.page.agency.b2: '<b>Agency</b>: several roles in-house, more capacity for large projects'
app.page.agency.b3: '<b>Cost</b>: a freelancer usually adds less overhead for project management and sales'
app.page.agency.b4: '<b>Risk</b>: availability and knowledge need to be secured deliberately in both cases'
app.page.agency.q1: 'Is a Symfony freelancer cheaper than an agency?'
app.page.agency.a1: 'Usually yes, because you do not pay for project management, account management and sales. The hourly rate alone says little, though: what counts is how many hours a result takes, and experience often saves more than a lower rate.'
app.page.agency.q2: 'When is an agency the better choice?'
app.page.agency.a2: 'When you need design, marketing, app development and backend at the same time, when many developers have to work on a large product in parallel, or when a tender requires a team with fixed roles.'
app.page.agency.q3: 'What happens if the freelancer is unavailable?'
app.page.agency.a3: 'The risk is real and can be covered: code in your own repository, documentation, automated tests and a reproducible deployment. Then any experienced Symfony developer can carry on.'
app.page.agency.link: ''
app.page.region.title: 'Software Developer in Ibbenbüren, Osnabrück & Münsterland | Achim Krämer'
app.page.region.description: 'Freelance software developer and Symfony programmer based in Ibbenbüren: custom web applications, interfaces and maintenance for companies in Osnabrück, Rheine, Münster and the Münsterland region.'
