app.page.region.lead: 'I am a freelance software developer based in Ibbenbüren, Germany, building custom web applications with PHP and Symfony for companies in the region and beyond.'
app.page.region.b1: '<b>Short distances</b> – one local point of contact who builds your project personally'
app.page.region.b2: '<b>Custom web applications</b> instead of off-the-shelf software that does not fit'
app.page.region.b3: '<b>Interfaces and automation</b> for existing systems'
app.page.region.b4: '<b>Maintenance and operations</b>, also for applications someone else built'
app.page.region.q1: 'Which companies do you work for?'
app.page.region.a1: 'Small and medium-sized companies, practices, start-ups and agencies that need a web application tailored to their processes or want to keep developing an existing one.'
app.page.region.q2: 'Do you only work for local clients?'
app.page.region.a2: 'No. Most collaboration happens remotely via video calls, Git and a shared ticket system. Clients from Ibbenbüren, Osnabrück and the Münsterland simply have the advantage that a personal meeting is easy to arrange.'
app.page.region.q3: 'Are you a web designer or a programmer?'
app.page.region.a3: 'My focus is programming: web applications, databases, interfaces and automation. I build user interfaces with TailwindCSS; for elaborate brand design I work together with designers.'
