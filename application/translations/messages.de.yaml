app.page.packages.description: 'Faire Festpreise für kleine Unternehmen, jährlich kündbar: Website ab 690 €, Betreuung mit Hosting und SSL für 15 € im Monat, Firmen-E-Mail, SEO und kostenlose E-Mail-Signatur.'
app.page.packages.h1: 'Website-Pakete für kleine Unternehmen'
app.page.packages.lead: 'Website, Domain, E-Mail und Google-Sichtbarkeit aus einer Hand, ohne teure Monatspakete. Du kümmerst Dich um Deine Kunden, ich um die Technik.'
app.page.packages.b1: '<b>Feste Preise</b>, laufend 240 € im Jahr inklusive SEO-Pflege, jährlich kündbar'
app.page.packages.b2: '<b>Ein Ansprechpartner</b> für Website, Domain, E-Mail und Google'
app.page.packages.b3: '<b>Änderungen per WhatsApp</b> schicken, 75 € pro Stunde im 15-Minuten-Takt'
app.page.packages.b4: '<b>Persönlich vor Ort</b> in Ibbenbüren, Osnabrück und dem Münsterland'
app.page.packages.q1: 'Welche Kosten laufen weiter?'
app.page.packages.a1: 'Website-Betreuung und SEO-Pflege laufen jeweils ein Jahr und sind zum Jahresende kündbar. Alles andere bezahlst Du einmalig. Bei einer Kündigung bekommst Du Domain, Inhalte und E-Mails vollständig übergeben.'
app.page.packages.q2: 'Kann ich meine bestehende Domain und E-Mail behalten?'
app.page.packages.a2: 'Ja. Ich ziehe Domain und Postfächer von Wix, GMX, Strato oder anderen Anbietern um, inklusive Weiterleitungen, damit keine E-Mail und kein Google-Eintrag verloren geht.'
app.page.packages.q3: 'Was bedeutet SEO für KI-Suche?'
app.page.packages.a3: 'Immer mehr Menschen fragen ChatGPT, Gemini oder die Google-KI-Antworten statt klassisch zu suchen. Strukturierte Daten, klare Antworten auf typische Fragen und ein gepflegtes Google-Unternehmensprofil sorgen dafür, dass Dein Betrieb dort genannt wird.'
app.page.packages.link: ''
app.page.upgrade.title: 'Symfony-Upgrade: von Symfony 5 oder 6 auf 7.4 LTS | Achim Krämer'
app.page.upgrade.description: 'Symfony-Upgrade und PHP-Migration ohne Stillstand: von Symfony 5.4 oder 6.4 auf 7.4 LTS, mit Analyse, Festpreis-Option und Tests. Freiberuflicher Symfony-Entwickler mit über 15 Jahren Symfony-Erfahrung.'
app.page.upgrade.h1: 'Symfony-Upgrade auf 7.4 LTS – planbar und ohne Stillstand'
app.page.upgrade.lead: 'Deine Anwendung läuft noch auf Symfony 5 oder 6 und einer alten PHP-Version? Ich bringe sie Schritt für Schritt auf Symfony 7.4 LTS und eine aktuelle PHP-Version, ohne dass der laufende Betrieb leidet.'
app.page.upgrade.b1: '<b>Upgrade-Analyse</b> mit Aufwandsschätzung, bevor eine Zeile Code geändert wird'
app.page.upgrade.b2: '<b>Deprecations zuerst</b> – Warnungen der alten Version abbauen, dann den Versionssprung machen'
app.page.upgrade.b3: '<b>PHP-Migration</b> auf eine Version, die noch Sicherheitsupdates bekommt'
app.page.upgrade.b4: '<b>Abgesichert durch Tests</b> – automatisierte Tests vor und nach jedem Schritt'
app.page.upgrade.q1: 'Warum sollte ich meine Symfony-Anwendung aktualisieren?'
app.page.upgrade.a1: 'Ältere Symfony- und PHP-Versionen bekommen irgendwann keine Sicherheitsupdates mehr. Wer zu lange wartet, muss mehrere Versionen auf einmal überspringen, und das wird mit jedem Jahr teurer. Ein Upgrade bringt außerdem bessere Performance und moderne Werkzeuge.'
app.page.upgrade.q2: 'Wie lange dauert ein Symfony-Upgrade?'
app.page.upgrade.a2: 'Das hängt vor allem von der Größe der Anwendung, der Zahl der Abhängigkeiten und davon ab, ob es Tests gibt. Kleine Anwendungen sind oft in wenigen Tagen umgestellt, große Projekte brauchen mehrere Wochen. Nach der Analyse bekommst Du eine konkrete Schätzung.'
app.page.upgrade.q3: 'Muss die Anwendung während des Upgrades offline gehen?'
app.page.upgrade.a3: 'Nein. Das Upgrade passiert in einem eigenen Branch und einer eigenen Testumgebung. Live geht es erst, wenn alles geprüft ist, und auch dann nur mit einem Weg zurück.'
app.page.upgrade.link: ''
app.page.maintenance.title: 'Symfony-Projekt übernehmen, warten und weiterentwickeln | Achim Krämer'
app.page.maintenance.description: 'Dein Entwickler ist weg oder die Agentur hat keine Zeit mehr? Ich übernehme bestehende Symfony-Projekte, prüfe den Zustand, halte sie sicher und entwickle sie weiter.'
app.page.maintenance.h1: 'Symfony-Projekt übernehmen, warten und weiterentwickeln'
app.page.maintenance.lead: 'Deine Symfony-Anwendung läuft, aber niemand kümmert sich mehr richtig darum? Ich übernehme bestehende Projekte, verschaffe mir einen ehrlichen Überblick und sorge dafür, dass sie sicher bleibt und weiterentwickelt werden kann.'
app.page.maintenance.b1: '<b>Projektübernahme</b> von Agenturen, Inhouse-Teams oder anderen Freelancern'
app.page.maintenance.b2: '<b>Code-Review und Bestandsaufnahme</b> mit klarer Liste der Risiken'
app.page.maintenance.b3: '<b>Laufende Wartung</b> – Sicherheitsupdates, Abhängigkeiten, Monitoring'
app.page.maintenance.b4: '<b>Weiterentwicklung</b> neuer Funktionen auf einer stabilen Grundlage'
app.page.maintenance.q1: 'Übernimmst Du auch Projekte, die jemand anderes gebaut hat?'
app.page.maintenance.a1: 'Ja, das ist ein großer Teil meiner Arbeit. Ich lese mich in fremden Code ein, auch wenn Dokumentation und Tests fehlen, und sage Dir offen, in welchem Zustand die Anwendung ist.'
app.page.maintenance.q2: 'Was gehört zur Wartung einer Symfony-Anwendung?'
app.page.maintenance.a2: 'Regelmäßige Updates von Symfony, PHP und allen Paketen, das Prüfen von Sicherheitsmeldungen, Backups und Monitoring sowie kleine Fehlerbehebungen, bevor sie zu großen werden.'
app.page.maintenance.q3: 'Was, wenn der Code in schlechtem Zustand ist?'
app.page.maintenance.a3: 'Dann wird nicht alles neu geschrieben. Ich sichere zuerst die wichtigsten Abläufe mit Tests ab und verbessere den Code danach Schritt für Schritt, während die Anwendung weiterläuft.'
app.page.maintenance.link: ''
app.page.agency.title: 'Symfony-Freelancer oder Agentur? Ein ehrlicher Vergleich | Achim Krämer'
app.page.agency.description: 'Symfony-Freelancer oder Agentur: Kosten, Ansprechpartner, Verfügbarkeit und Risiko im Vergleich. Wann sich welche Lösung lohnt, erklärt von einem freiberuflichen Symfony-Entwickler.'
app.page.agency.h1: 'Symfony-Freelancer oder Agentur – was passt zu Deinem Projekt?'
app.page.agency.lead: 'Beide Wege können richtig sein. Entscheidend sind Größe und Laufzeit des Projekts, Dein Budget und wie viel Abstimmung Du selbst leisten möchtest. Hier ist ein ehrlicher Vergleich, auch an den Stellen, an denen eine Agentur besser passt.'
app.page.agency.b1: '<b>Freelancer</b>: ein fester Ansprechpartner, der den Code selbst schreibt'
app.page.agency.b2: '<b>Agentur</b>: mehrere Rollen im Haus, mehr Kapazität bei großen Projekten'
app.page.agency.b3: '<b>Kosten</b>: beim Freelancer meist weniger Aufschlag für Projektleitung und Vertrieb'
app.page.agency.b4: '<b>Risiko</b>: Ausfall und Wissen müssen in beiden Fällen bewusst abgesichert werden'
app.page.agency.q1: 'Ist ein Symfony-Freelancer günstiger als eine Agentur?'
app.page.agency.a1: 'Meist ja, weil keine Projektleitung, kein Account-Management und kein Vertrieb mitbezahlt werden. Der Stundensatz allein sagt aber wenig: Entscheidend ist, wie viele Stunden ein Ergebnis braucht, und Erfahrung spart hier oft mehr als ein niedriger Satz.'
app.page.agency.q2: 'Wann ist eine Agentur die bessere Wahl?'
app.page.agency.a2: 'Wenn Du gleichzeitig Design, Marketing, App-Entwicklung und Backend brauchst, wenn viele Entwickler parallel an einem großen Produkt arbeiten müssen oder wenn eine Ausschreibung ein Team mit festen Rollen verlangt.'
app.page.agency.q3: 'Was passiert, wenn der Freelancer ausfällt?'
app.page.agency.a3: 'Das Risiko ist real und lässt sich absichern: Code in Deinem eigenen Repository, Dokumentation, automatisierte Tests und ein reproduzierbares Deployment. Dann kann jeder erfahrene Symfony-Entwickler weitermachen.'
app.page.agency.link: ''
app.page.region.title: 'Softwareentwickler in Ibbenbüren, Osnabrück & Münsterland | Achim Krämer'
app.page.region.description: 'Freiberuflicher Softwareentwickler und Symfony-Programmierer aus Ibbenbüren: individuelle Webanwendungen, Schnittstellen und Wartung für Unternehmen in Osnabrück, Rheine, Münster und dem Münsterland.'
app.page.region.h1: 'Softwareentwickler in Ibbenbüren, Osnabrück und dem Münsterland'
app.page.region.lead: 'Ich bin freiberuflicher Softwareentwickler mit Sitz in Ibbenbüren und entwickle individuelle Webanwendungen mit PHP und Symfony – für Unternehmen aus der Region und darüber hinaus.'
app.page.region.b1: '<b>Kurze Wege</b> – ein Ansprechpartner aus der Region, der Dein Projekt selbst umsetzt'
app.page.region.b2: '<b>Individuelle Webanwendungen</b> statt Standardsoftware, die nicht passt'
app.page.region.b3: '<b>Schnittstellen und Automatisierung</b> für bestehende Systeme'
app.page.region.b4: '<b>Wartung und Betrieb</b>, auch für Anwendungen, die jemand anderes gebaut hat'
app.page.region.q1: 'Für welche Unternehmen arbeitest Du?'
app.page.region.a1: 'Für kleine und mittlere Unternehmen, Praxen, Start-ups und Agenturen, die eine Webanwendung brauchen, die genau zu ihren Abläufen passt, oder eine bestehende Anwendung weiterentwickeln wollen.'
app.page.region.q2: 'Arbeitest Du nur für Kunden aus der Region?'
app.page.region.a2: 'Nein. Die meiste Zusammenarbeit läuft remote über Videocalls, Git und ein gemeinsames Ticketsystem. Kunden aus Ibbenbüren, Osnabrück und dem Münsterland haben aber den Vorteil, dass ein persönliches Treffen schnell organisiert ist.'
app.page.region.q3: 'Bist Du Webdesigner oder Programmierer?'
app.page.region.a3: 'Mein Schwerpunkt ist die Programmierung: Webanwendungen, Datenbanken, Schnittstellen und Automatisierung. Oberflächen setze ich mit TailwindCSS um; für ein aufwendiges Markendesign arbeite ich mit Designern zusammen.'
app.page.region.link: ''
