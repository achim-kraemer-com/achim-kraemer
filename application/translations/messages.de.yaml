app.page.hosting.title: 'Hosting, Domains, E-Mail & SSL aus einer Hand | Achim Krämer'
app.page.hosting.description: 'Webhosting, Domainverwaltung, professionelle E-Mail-Einrichtung und SSL-Zertifikate: Betrieb und Entwicklung Deiner Website aus einer Hand, mit transparenten Preisen.'
app.page.hosting.h1: 'Hosting, Domains, E-Mail & SSL aus einer Hand'
app.page.hosting.lead: 'Neben der Entwicklung kümmere ich mich auf Wunsch um den technischen Unterbau Deiner Website: Hosting, Domains, E-Mail-Adressen und Verschlüsselung, mit transparenten Preisen.'
app.page.hosting.b1: '<b>Webhosting</b> für Websites und Webanwendungen'
app.page.hosting.b2: '<b>Domainverwaltung</b> – Registrierung, Umzug und Pflege'
app.page.hosting.b3: '<b>E-Mail-Einrichtung</b> mit eigener Domain für Programme und Geräte'
app.page.hosting.b4: '<b>SSL-Zertifikate</b> für verschlüsselte Verbindungen'
app.page.hosting.q1: 'Warum Entwicklung und Hosting aus einer Hand?'
app.page.hosting.a1: 'Du hast einen Ansprechpartner für Website, Server, Domain und E-Mail. Das verkürzt Wege, vermeidet Schuldzuweisungen zwischen Dienstleistern und hält Deine Technik zusammen.'
app.page.hosting.q2: 'Was bedeutet E-Mail-Einrichtung mit eigener Domain?'
app.page.hosting.a2: 'Statt einer allgemeinen Adresse nutzt Du Adressen wie name@deine-firma.de. Ich richte Postfächer ein und verbinde sie mit Deinen Programmen und Geräten.'
app.page.hosting.q3: 'Wozu brauche ich ein SSL-Zertifikat?'
app.page.hosting.a3: 'Ein SSL-Zertifikat verschlüsselt die Verbindung zwischen Besucher und Server. Browser kennzeichnen Seiten ohne Verschlüsselung als nicht sicher, und es ist für Datenschutz und Vertrauen wichtig.'
