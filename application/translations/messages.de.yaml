app.about.text: 'Willkommen! Als erfahrener PHP- und Symfony-Entwickler mit über 20 Jahren Expertise unterstütze ich Dein Projekt von der Idee bis zur erfolgreichen Umsetzung. Du profitierst von maßgeschneiderten, skalierbaren Lösungen, schnellen Entwicklungszyklen und einem Fokus auf Performance und Sicherheit. Ob Neuentwicklung, Optimierung bestehender Anwendungen oder langfristige Betreuung – ich stehe Dir als zuverlässiger Partner zur Seite, um Deine Ziele effizient und erfolgreich zu erreichen.'
app.portfolio.title1: 'Symfony-Expertise:'
app.portfolio.text1: 'Effizienter Einsatz aller Symfony-Komponenten und Best Practices für saubere, wartbare Anwendungen.'
app.portfolio.title2: 'Architektur und Design Patterns:'
app.portfolio.text2: 'Erfahren in MVC, DDD und hexagonaler Architektur, ideal für komplexe, langlebige Lösungen.'
app.portfolio.title3: 'API- und Performance-Optimierung:'
app.portfolio.text3: 'Maßgeschneiderte Caching-Strategien und optimierte Datenbankabfragen für leistungsstarke Anwendungen.'
app.portfolio.title4: 'Testing und CI/CD:'
app.portfolio.text4: 'Qualitätssicherung durch Tests, automatisierte Deployments und Containerisierung (Docker).'
app.portfolio.title5: 'Kommunikation und Teamarbeit:'
app.portfolio.text5: 'Klare Projektkommunikation und enge Zusammenarbeit mit Stakeholdern.'
app.portfolio.title6: 'Technologien und Tools:'
app.portfolio.text6: 'Programmiersprachen: PHP8.x+, JavaScript, HTML5, CSS3<br>Frameworks: Symfony 2 - 7+, jQuery<br>Datenbanken: MySQL, PostgreSQL, MongoDB, Firestore, BigQuery<br>APIs: REST, GraphQL, SOAP<br>DevOps: Docker, Jenkins<br>Versionierung: Git, GitHub, GitLab'
app.portfolio.end_text: 'Ich freue mich darauf, gemeinsam mit Dir Dein Projekt voranzutreiben!'
app.references.text: 'Ausgewählte Projekte, die ich als freiberuflicher Symfony-Entwickler umgesetzt habe – von der Architektur über die Entwicklung bis in den laufenden Betrieb.'
app.references.mirwena_category: 'Digitale Anamnese für Therapiepraxen'
app.references.mirwena_title: 'Mirwena – Digitaler Anamnesebogen'
app.references.mirwena_link_title: 'Mirwena – digitaler Anamnesebogen für Physiotherapie- und Osteopathie-Praxen'
app.references.mirwena_text: 'Mirwena ist eine Web-Anwendung für Physiotherapie-, Osteopathie- und Ergotherapie-Praxen: Patientinnen und Patienten füllen den Anamnesebogen vor dem Termin in Ruhe auf dem eigenen Handy aus, die Praxis erhält ihn vollständig, lesbar und verschlüsselt zurück – ohne Abtippen und ohne unleserliche Handschrift. Ich habe das Projekt als freiberuflicher Entwickler umgesetzt: Architektur, Backend, Oberfläche und Betrieb.'
app.references.mirwena_feature1: '<b>Symfony-Backend</b> – eigene Installation, eigene Datenbank und eigener Schlüssel je Praxis statt gemeinsamem Datentopf.'
app.references.mirwena_feature2: '<b>DSGVO-konforme Verschlüsselung</b> – Beschwerden, Vorerkrankungen, Medikamente und Unterschrift liegen feldweise verschlüsselt (Art. 9 DSGVO).'
app.references.mirwena_feature3: '<b>Interaktives Körperschema</b> – Schmerzzonen werden auf Vorder- und Rückseite direkt mit dem Finger markiert.'
app.references.mirwena_feature4: '<b>Sichere Einmal-Zugänge</b> – Links per E-Mail und QR-Code, gültig für 24 Stunden, danach automatisch entwertet und gelöscht.'
app.references.mirwena_feature5: '<b>Mandantenfähigkeit &amp; Branding</b> – eigene Subdomain je Praxis mit individuellen Farben, Logo und formatierter PDF-Druckansicht.'
app.references.mirwena_link: 'Projekt ansehen auf mirwena.de'
app.references.mirwena_tech_privacy: 'DSGVO'
app.references.mirwena_schema_description: 'Digitaler Anamnesebogen für Physiotherapie-, Osteopathie- und Ergotherapie-Praxen: Patienten füllen den Bogen vor dem Termin auf dem eigenen Gerät aus, die Praxis erhält ihn vollständig, lesbar und DSGVO-konform verschlüsselt. Entwickelt von Achim Krämer als freiberuflicher Symfony-Entwickler.'
app.testimonials.title: 'Kundenstimmen'
app.testimonials.text: 'Erfolgreiche Projekte entstehen durch Vertrauen, Transparenz und technische Qualität. In den folgenden Stimmen berichten meine Kund:innen von ihren Erfahrungen aus gemeinsamen Projekten.'
app.testimonials.iris_role: 'Rechtliche Betreuerin'
app.testimonials.iris_quote: 'Achim Krämer hat meine Website als rechtliche Betreuerin professionell und sehr gut erstellt. Vielen Dank für die freundliche und kompetente Beratung. Wünsche meinerseits wurden umgehend und zufriedenstellend umgesetzt. Auch anschließend war er immer kurzfristig erreichbar.'
app.testimonials.thomas_role: 'Therapiepraxis'
app.testimonials.thomas_quote: 'Moin Achim, ich wollte mich ganz herzlich bei dir bedanken. Du hast meine Vorstellungen super umgesetzt und immer auf Augenhöhe mit mir kommuniziert. Du konntest meine Bedenken und Fragen sehr gut beantworten – dabei immer kompetent, aber dennoch unkompliziert. Und es hat richtig viel Spaß gemacht, mit dir zusammenzuarbeiten.'
app.testimonials.thorsten_role: 'ELB Solution'
app.testimonials.thorsten_quote: 'Wir sind sehr zufrieden mit der Erstellung unserer ersten Homepage durch Achim Krämer. Für ELB Solution war es der erste Schritt ins Internet – und die Umsetzung hätte besser nicht laufen können. Von Anfang an war die Zusammenarbeit unkompliziert, professionell und angenehm. Unsere Vorstellungen wurden schnell aufgenommen und mit viel Kreativität sowie technischem Know-how umgesetzt. Die Webseite ist modern, übersichtlich und funktioniert auf allen Geräten einwandfrei. Auch Änderungswünsche wurden zügig und zuverlässig umgesetzt. Dank Achim Krämer hat ELB Solution nun einen richtig gelungenen ersten Webauftritt. Klare Weiterempfehlung und vielen Dank für die tolle Arbeit!'
