app.dev.i1_text: 'Login, Rollen und Rechte, mehrere Mandanten mit sauber getrennten Daten. Deine Kunden erledigen online, was sonst am Telefon hängt.'
app.dev.i2_title: 'Interne Werkzeuge'
app.dev.i2_text: 'Auftrags-, Termin- oder Kundenverwaltung statt Excel und Zettelwirtschaft. Mit Übersichten, PDF-Export und Benachrichtigungen.'
app.dev.i3_title: 'Schnittstellen & Automatisierung'
app.dev.i3_text: 'Anbindung an ERP, CRM, Buchhaltung oder Zahlungsanbieter. Daten fließen automatisch, statt abgetippt zu werden.'
app.dev.i4_title: 'KI, wo sie etwas bringt'
app.dev.i4_text: 'Daten aus PDFs und Rechnungen auslesen, Assistenten mit Deinem Firmenwissen, Agenten für wiederkehrende Aufgaben.'
app.dev.i5_title: 'Upgrade & Übernahme'
app.dev.i5_text: 'Deine Anwendung läuft noch auf Symfony 5 oder 6? Ich bringe sie auf 7.4 LTS oder übernehme ein Projekt, dessen Entwickler nicht mehr da ist.'
app.dev.i6_title: 'Product Owner'
app.dev.i6_text: 'Ich übersetze Geschäftsziele in klare Anforderungen. Weil ich selbst entwickle, spreche ich die Sprache von Fachbereich und Entwicklung.'
