app.page.symfony.title: 'Symfony-Entwicklung: maßgeschneiderte Webanwendungen | Achim Krämer'
app.page.symfony.description: 'Individuelle Webanwendungen mit Symfony und PHP: Dashboards, Benutzerverwaltung, Login und automatisierte Prozesse von einem freiberuflichen Symfony-Entwickler mit über 20 Jahren Erfahrung.'
app.page.symfony.h1: 'Symfony-Entwicklung für maßgeschneiderte Webanwendungen'
app.page.symfony.lead: 'Als freiberuflicher Symfony-Entwickler mit über 20 Jahren PHP-Erfahrung baue ich Webanwendungen, die zu Deinen Abläufen passen – robust, skalierbar und sicher.'
app.page.symfony.b1: '<b>Dashboards & Statistiken</b> mit Echtzeit-Daten und Grafiken'
app.page.symfony.b2: '<b>Benutzerverwaltung</b> mit Rollen- und Rechtesystem'
app.page.symfony.b3: '<b>Login & Authentifizierung</b> per E-Mail, Google oder weiteren Anbietern, auf Wunsch mit 2FA'
app.page.symfony.b4: '<b>Performance & Sicherheit</b> durch Caching, Tuning und aktuelle Sicherheitsstandards'
app.page.symfony.q1: 'Wann lohnt sich eine individuelle Symfony-Anwendung?'
app.page.symfony.a1: 'Sie lohnt sich, wenn Standardsoftware Deine Abläufe nicht abbildet oder wenn manuelle Aufgaben und Fehler Zeit kosten. Eine maßgeschneiderte Anwendung automatisiert genau diese Prozesse und lässt sich nahtlos in bestehende Systeme integrieren.'
app.page.symfony.q2: 'Übernimmst Du auch bestehende Symfony-Projekte?'
app.page.symfony.a2: 'Ja. Neben Neuentwicklungen optimiere ich bestehende Anwendungen und betreue sie langfristig, zum Beispiel bei Ladezeiten, Wartbarkeit und Sicherheit.'
app.page.symfony.q3: 'Wie stellst Du die Qualität sicher?'
app.page.symfony.a3: 'Durch saubere Architektur nach Symfony Best Practices, automatisierte Tests, reproduzierbare Docker-Umgebungen und automatisierte Deployments sowie eine enge, klare Kommunikation mit allen Beteiligten.'
app.page.symfony.link: ''
app.page.api.title: 'API-Entwicklung & Schnittstellen mit Symfony | Achim Krämer'
app.page.api.description: 'REST-APIs, Datenimport und -export, PDF-Generierung und Hintergrundprozesse: Schnittstellen und Automatisierung mit Symfony von einem freiberuflichen PHP-Entwickler.'
app.page.api.h1: 'API-Entwicklung, Schnittstellen & Automatisierung'
app.page.api.lead: 'Ich verbinde Deine Anwendung mit externen Diensten, stelle eigene Schnittstellen bereit und automatisiere wiederkehrende Aufgaben wie Dokumentenerstellung und Datenaustausch.'
app.page.api.b1: '<b>Externe Dienste anbinden</b> – Zahlungsanbieter, CRM, ERP'
app.page.api.b2: '<b>Eigene API</b> – Daten für Dritte bereitstellen'
app.page.api.b3: '<b>Datenimport & -export</b> – automatisierter Austausch mit anderen Systemen'
app.page.api.b4: '<b>PDF, E-Mail & Hintergrundprozesse</b> – Rechnungen, Berichte, E-Mail-Verarbeitung und geplante Tasks'
app.page.api.q1: 'Was ist eine API-Schnittstelle und wofür brauche ich sie?'
app.page.api.a1: 'Eine API lässt Systeme automatisch Daten austauschen. Du brauchst sie, wenn Deine Anwendung zum Beispiel Zahlungen, Kundendaten oder Bestellungen mit anderen Diensten abgleichen soll, statt dass jemand sie von Hand überträgt.'
app.page.api.q2: 'Welche Arten von Schnittstellen entwickelst Du?'
app.page.api.a2: 'Ich arbeite mit REST, GraphQL und SOAP, binde externe APIs an und baue eigene Schnittstellen für Deine Anwendung auf Basis von Symfony.'
app.page.api.q3: 'Was lässt sich im Hintergrund automatisieren?'
app.page.api.a3: 'Typische Beispiele sind die automatische Erstellung von Rechnungen und Berichten als PDF, die Verarbeitung eingehender E-Mails und geplante Tasks, etwa eine nächtliche Datenverarbeitung.'
app.page.api.link: ''
app.page.ai.title: 'KI-Integration & Agentic AI für PHP-Anwendungen | Achim Krämer'
app.page.ai.description: 'KI-Agenten, RAG-Assistenten, Datenextraktion aus PDFs und Content-Automatisierung: LLM-Anbindung sicher und sinnvoll in bestehende Symfony-Systeme integriert.'
app.page.ai.h1: 'KI-Integration & Agentic AI'
app.page.ai.lead: 'Ich integriere KI dort, wo sie Prozesse tatsächlich entlastet – sinnvoll, sicher und passend zu Deinen bestehenden Systemen.'
app.page.ai.b1: '<b>Autonome KI-Agenten</b> analysieren Prozesse, steuern APIs an und lösen Support- und Rechercheaufgaben'
app.page.ai.b2: '<b>Unternehmens-KI (RAG)</b> beantwortet Fragen auf Basis Deines internen Wissens'
app.page.ai.b3: '<b>Datenextraktion</b> macht aus PDFs, Rechnungen und Bildern strukturierte Daten'
app.page.ai.b4: '<b>Content-Automatisierung</b> erstellt kontextsensitive Texte wie Produktbeschreibungen oder Reports'
app.page.ai.q1: 'Was ist Agentic AI?'
app.page.ai.a1: 'Agentic AI bezeichnet KI-Agenten, die nicht nur Fragen beantworten, sondern eigenständig Prozesse analysieren, Schnittstellen ansteuern und Aufgaben vollautomatisch lösen.'
app.page.ai.q2: 'Wie bleiben Unternehmensdaten bei KI-Lösungen geschützt?'
app.page.ai.a2: 'Bei RAG-Assistenten wird die KI mit Deinem internen Firmenwissen gespeist und liefert präzise, datenschutzkonforme Antworten für Mitarbeiter oder Kunden. Wie die Daten verarbeitet werden, legen wir vorab gemeinsam fest.'
app.page.ai.q3: 'Lässt sich KI in bestehende Systeme integrieren?'
app.page.ai.a3: 'Ja. Die Anbindung von LLMs erfolgt über Schnittstellen und fügt sich in vorhandene Symfony- und PHP-Anwendungen ein, ohne dass Du Deine Systeme ersetzen musst.'
app.page.ai.link: ''
app.page.mirwena.title: 'Mirwena: digitaler Anamnesebogen für Therapiepraxen | Fallstudie'
app.page.mirwena.description: 'Fallstudie Mirwena: DSGVO-konformer digitaler Anamnesebogen für Physiotherapie-, Osteopathie- und Ergotherapie-Praxen, entwickelt mit Symfony von Achim Krämer.'
app.page.mirwena.h1: 'Mirwena – digitaler Anamnesebogen für Therapiepraxen'
app.page.mirwena.lead: 'Mirwena ist eine Web-Anwendung für Physiotherapie-, Osteopathie- und Ergotherapie-Praxen: Patientinnen und Patienten füllen den Anamnesebogen vor dem Termin auf dem eigenen Handy aus, die Praxis erhält ihn vollständig, lesbar und verschlüsselt.'
app.page.mirwena.b1: '<b>Symfony-Backend</b> mit eigener Installation, Datenbank und eigenem Schlüssel je Praxis'
app.page.mirwena.b2: '<b>Feldweise Verschlüsselung</b> sensibler Gesundheitsdaten (Art. 9 DSGVO)'
app.page.mirwena.b3: '<b>Interaktives Körperschema</b> zum Markieren von Schmerzzonen per Finger'
app.page.mirwena.b4: '<b>Einmal-Zugänge</b> per E-Mail-Link und QR-Code, nach 24 Stunden automatisch entwertet'
app.page.mirwena.q1: 'Welches Problem löst Mirwena?'
app.page.mirwena.a1: 'Praxen müssen keine Bögen mehr abtippen und keine unleserliche Handschrift entziffern. Patienten füllen den Bogen in Ruhe vor dem Termin aus, die Praxis erhält ihn digital und vollständig.'
app.page.mirwena.q2: 'Wie schützt Mirwena sensible Gesundheitsdaten?'
app.page.mirwena.a2: 'Beschwerden, Vorerkrankungen, Medikamente und Unterschrift liegen feldweise verschlüsselt. Jede Praxis bekommt eine eigene Installation mit eigener Datenbank und eigenem Schlüssel, statt eines gemeinsamen Datentopfs. Zugangslinks gelten 24 Stunden und werden danach entwertet und gelöscht.'
app.page.mirwena.q3: 'Was habe ich als Entwickler umgesetzt?'
app.page.mirwena.a3: 'Architektur, Backend, Oberfläche und Betrieb. Zum Projekt gehören außerdem eine eigene Subdomain je Praxis mit individuellen Farben und Logo sowie eine formatierte PDF-Druckansicht.'
app.page.mirwena.link: 'Projekt ansehen auf mirwena.de'
app.page.freelancer.title: 'Freelancer-CRM mit Symfony: Kunden, Projekte, Rechnungen | Fallstudie'
app.page.freelancer.description: 'Fallstudie: ein eigenes Freelancer-CRM auf Basis von Symfony 8 für Kunden, Projekte, Aufgaben und Rechnungen mit automatischer PDF-Erstellung.'
app.page.freelancer.h1: 'Freelancer-CRM – Kunden, Projekte und Rechnungen'
app.page.freelancer.lead: 'Eine Symfony-Anwendung für meine eigene Selbstständigkeit: Sie verwaltet Kunden, Projekte und Aufgaben und erzeugt daraus Rechnungen als PDF.'
app.page.freelancer.b1: '<b>Kunde → Projekt → Aufgabe → Rechnung</b> als durchgängiger Ablauf'
app.page.freelancer.b2: '<b>Abrechnung</b> nach Stunden oder zum Festpreis je Aufgabe'
app.page.freelancer.b3: '<b>Rechnungs-PDF</b> aus ausgewählten offenen Aufgaben eines Projekts, mit Status erstellt, verschickt und bezahlt'
app.page.freelancer.b4: '<b>Geschützter Admin-Bereich</b> mit Login und Rollen'
app.page.freelancer.q1: 'Wofür wird das Freelancer-CRM eingesetzt?'
app.page.freelancer.a1: 'Es ersetzt Tabellen und manuelle Rechnungsvorlagen: Aufgaben werden erfasst, einem Projekt zugeordnet und später gesammelt in Rechnungen überführt.'
app.page.freelancer.q2: 'Wie entsteht eine Rechnung?'
app.page.freelancer.a2: 'Aus den offenen Aufgaben eines Projekts wählt die Anwendung die abzurechnenden Positionen aus und befüllt eine PDF-Vorlage automatisch. Der Status der Rechnung lässt sich vom Erstellen bis zur Bezahlung nachverfolgen.'
app.page.freelancer.q3: 'Welche Technik steckt dahinter?'
app.page.freelancer.a3: 'Symfony 8 mit PHP 8.5, Doctrine ORM, MariaDB und Docker. Der Bereich hinter dem Login ist nicht öffentlich, die Startseite ist online erreichbar.'
app.page.freelancer.link: 'Zum Freelancer-Portal'
app.page.signature.title: 'E-Mail-Signatur-Generator für Outlook, Apple Mail & Gmail | Fallstudie'
app.page.signature.description: 'Fallstudie: ein Web-Tool, mit dem sich professionelle E-Mail-Signaturen in wenigen Minuten erstellen und mit einem Klick in Outlook, Apple Mail oder Gmail einfügen lassen.'
app.page.signature.h1: 'E-Mail-Signatur-Generator'
app.page.signature.lead: 'Kontaktdaten einmal eintragen, Logo hochladen und die fertige Signatur mit einem Klick in Outlook, Apple Mail oder Gmail einfügen.'
app.page.signature.b1: '<b>Alles in einem Formular</b> – Name, Firma, Adresse, Telefon, Social-Media-Links und Bankverbindung'
app.page.signature.b2: '<b>Zwei Layouts</b> pro Signatur, wahlweise mit rundem Logo'
app.page.signature.b3: '<b>Automatischer Logo-Zuschnitt</b> beim Hochladen'
app.page.signature.b4: '<b>Kopieren per Klick</b> – die Signatur landet formatiert in der Zwischenablage'
app.page.signature.q1: 'Welches Problem löst das Tool?'
app.page.signature.a1: 'Einheitliche, professionell gestaltete E-Mail-Signaturen sind mühsam, wenn sie von Hand in HTML gebaut werden. Das Tool nimmt Daten und Logo entgegen und liefert eine fertige Signatur.'
app.page.signature.q2: 'Wie fügt man die Signatur ins Mailprogramm ein?'
app.page.signature.a2: 'Ein Klick kopiert die Signatur formatiert in die Zwischenablage. Von dort lässt sie sich direkt in die Signatureinstellungen von Outlook, Apple Mail oder Gmail einfügen.'
app.page.signature.q3: 'Wie ist das Tool aufgebaut?'
app.page.signature.a3: 'Als Symfony-Anwendung mit Twig-Templates und etwas JavaScript für Logo-Zuschnitt und Zwischenablage. Die Startseite ist öffentlich, das Erstellen von Signaturen erfolgt nach dem Login.'
app.page.signature.link: 'Zum E-Mail-Signatur-Tool'
app.faq.title: 'Häufige Fragen'
app.faq.q1: 'Was macht ein Symfony-Freelancer?'
app.faq.a1: 'Ein Symfony-Freelancer entwickelt als Selbstständiger Webanwendungen mit dem PHP-Framework Symfony, von Dashboards und Benutzerverwaltung über Schnittstellen bis zur Automatisierung. Ich entwickle seit über 20 Jahren Software, davon mehr als 15 Jahre mit Symfony, von der Idee über die Umsetzung bis in den laufenden Betrieb.'
app.faq.q2: 'Für welche Projekte bin ich der Richtige?'
app.faq.a2: 'Für Neuentwicklungen, die Optimierung bestehender Anwendungen und die langfristige Betreuung. Typische Aufgaben sind maßgeschneiderte Webanwendungen, API-Anbindungen, Dokumentenautomatisierung und KI-Integration.'
app.faq.q3: 'Wie setze ich KI in Projekten ein?'
app.faq.a3: 'Ich baue KI-Agenten, RAG-Assistenten auf Basis Deines Firmenwissens, Datenextraktion aus PDFs und Rechnungen sowie Content-Automatisierung und binde sie in bestehende Systeme ein.'
app.faq.q4: 'Wie sicher und datenschutzkonform sind Deine Anwendungen?'
app.faq.a4: 'Sicherheit und Datenschutz gehören von Beginn an zur Architektur. Bei Mirwena etwa liegen Gesundheitsdaten feldweise verschlüsselt, jede Praxis hat eigene Datenbank und eigenen Schlüssel.'
app.faq.q5: 'Mit welchen Technologien arbeitest Du?'
app.faq.a5: 'PHP 8.x und Symfony, Doctrine ORM, MySQL, MariaDB und PostgreSQL, REST und GraphQL, JavaScript und TailwindCSS sowie Docker, CI/CD und Git.'
app.faq.q6: 'Wie kann ich Kontakt aufnehmen?'
app.faq.a6: 'Über das Kontaktformular auf dieser Seite, per E-Mail an kontakt@achim-kraemer.com oder telefonisch unter +49 1756 821391.'
