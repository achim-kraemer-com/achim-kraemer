app.faq.q7: 'Was kostet eine Website bei Dir?'
app.faq.a7: 'Eine Website für Handy und Desktop gibt es ab 690 € einmalig. Die Betreuung mit Hosting, .de-Domain, SSL-Zertifikat, Updates und Backups kostet 15 € im Monat, jährlich abgerechnet und jährlich kündbar. Eine Firmen-E-Mail kostet einmalig 49 €, die Einrichtung für Google und KI-Suche 120 €, Änderungen 75 € pro Stunde. Alle Preise zzgl. MwSt.'
app.faq.q8: 'Kann ich meine Domain und E-Mail von Wix, GMX oder Strato mitnehmen?'
app.faq.a8: 'Ja. Ich ziehe Domain und Postfächer von Wix, GMX, Strato oder anderen Anbietern um, inklusive Weiterleitungen, damit keine E-Mail und kein Google-Eintrag verloren geht.'
app.faq.q9: 'Wie werde ich bei Google und in KI-Suchen wie ChatGPT gefunden?'
app.faq.a9: 'Mit einem gepflegten Google-Unternehmensprofil, lokalen Suchbegriffen, strukturierten Daten und klaren Antworten auf typische Kundenfragen. So taucht Dein Betrieb in der Google-Suche, in Google Maps und in Antworten von ChatGPT, Gemini oder Perplexity auf.'
app.faq.q10: 'Arbeitest Du nur in Ibbenbüren?'
app.faq.a10: 'Nein. Für Websites komme ich in Ibbenbüren, Osnabrück und dem Münsterland gern persönlich vorbei. Softwareprojekte mit Symfony setze ich bundesweit remote um.'
